# qu-ng-l-key-n-ng-c-p
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin - Quản Lý Key Cloud</title>
  <style>
    :root {
      --bg-color: #0b0d19;
      --card-bg: rgba(22, 26, 46, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #25f4ee;
      --danger: #ff4d4d;
      --success: #2ed573;
      --text: #ffffff;
      --text-sub: #a0a5c0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg-color); color: var(--text); padding: 20px 16px; min-height: 100vh; }
    .container { max-width: 600px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 25px; }
    .header h1 { color: var(--primary); font-size: 1.4rem; font-weight: 800; letter-spacing: 1px; }
    .header p { font-size: 0.85rem; color: var(--text-sub); margin-top: 4px; }
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      padding: 24px;
      border-radius: 20px;
      margin-bottom: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 8px; font-weight: 700; font-size: 0.85rem; color: var(--text-sub); }
    input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(10, 12, 22, 0.6); color: #fff; font-size: 1rem; outline: none; }
    .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: 800; font-size: 0.95rem; cursor: pointer; }
    .btn-create { background: linear-gradient(135deg, var(--primary), #00b894); color: #050b14; }
    
    .key-list { display: flex; flex-direction: column; gap: 12px; }
    .key-item {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border: 1px solid var(--card-border);
      border-left: 4px solid var(--primary);
    }
    .key-header { display: flex; justify-content: space-between; align-items: center; }
    .key-code { font-size: 1.1rem; font-weight: 800; color: var(--primary); letter-spacing: 1px; }
    .key-status { font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; font-weight: 800; }
    .status-active { background: rgba(46, 213, 115, 0.15); color: var(--success); border: 1px solid rgba(46, 213, 115, 0.3); }
    .status-expired { background: rgba(255, 77, 77, 0.15); color: var(--danger); border: 1px solid rgba(255, 77, 77, 0.3); }
    .key-info { font-size: 0.8rem; color: var(--text-sub); }
    .key-actions { display: flex; gap: 10px; }
    .btn-sm { flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: 700; font-size: 0.8rem; cursor: pointer; }
    .btn-copy { background: rgba(255,255,255,0.1); color: #fff; }
    .btn-delete { background: rgba(255, 77, 77, 0.2); color: var(--danger); border: 1px solid rgba(255, 77, 77, 0.3); }

    @media (min-width: 600px) {
      .key-item { flex-direction: row; align-items: center; justify-content: space-between; }
      .key-actions { width: auto; }
      .btn-sm { flex: initial; padding: 8px 16px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>👑 QUẢN LÝ KEY CLOUD VIP</h1>
      <p>Trang Dành Cho Chủ Shop (Đồng Bộ Đám Mây)</p>
    </div>

    <div class="card">
      <div class="form-group">
        <label for="key-days">Thời Hạn Cấp Key (Số Ngày):</label>
        <input type="number" id="key-days" value="30" min="1">
      </div>
      <button class="btn btn-create" onclick="generateKey()">+ TẠO KEY MỚI LÊN ĐÁM MÂY</button>
    </div>

    <h2 style="font-size: 1rem; margin-bottom: 14px; color: var(--text-sub); font-weight: 700;">DANH SÁCH KEY TRÊN HỆ THỐNG</h2>
    <div class="key-list" id="key-list">Đang tải dữ liệu đám mây...</div>
  </div>

  <!-- Firebase App & Realtime Database SDK (v8) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // Cấu hình Firebase của bạn
    const firebaseConfig = {
      apiKey: "AIzaSyCQKrsf4BGtI8-PUB1oyp5wz-OpL11MP1A",
      authDomain: "quanlykey-f0f93.firebaseapp.com",
      databaseURL: "https://quanlykey-f0f93-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "quanlykey-f0f93",
      storageBucket: "quanlykey-f0f93.firebasestorage.app",
      messagingSenderId: "430622101392",
      appId: "1:430622101392:web:fc87ccb0063484dce12d15",
      measurementId: "G-626GQ6KXRM"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('tiktok_keys');

    function generateKey() {
      const days = parseInt(document.getElementById('key-days').value) || 30;
      const randomKey = 'TTXU-' + Math.random().toString(36).substring(2, 8).toUpperCase();
      
      const expireDate = new Date();
      expireDate.setDate(expireDate.getDate() + days);

      db.child(randomKey).set(expireDate.toISOString()).then(() => {
        alert('Đã tạo thành công Key: ' + randomKey);
      });
    }

    function copyKey(key) {
      navigator.clipboard.writeText(key).then(() => {
        alert('Đã chép Key: ' + key);
      });
    }

    function deleteKey(key) {
      if (confirm('Bạn có chắc muốn xóa Key: ' + key + '?')) {
        db.child(key).remove();
      }
    }

    db.on('value', (snapshot) => {
      const keys = snapshot.val() || {};
      const container = document.getElementById('key-list');
      container.innerHTML = '';
      const now = new Date();
      const keyArray = Object.keys(keys);

      if (keyArray.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:var(--text-sub); padding:30px; font-size:0.9rem;">Chưa có Key nào trên Đám mây.</div>';
        return;
      }

      keyArray.reverse().forEach(key => {
        const expireDate = new Date(keys[key]);
        const isExpired = expireDate < now;
        const item = document.createElement('div');
        item.className = 'key-item';
        item.style.borderLeftColor = isExpired ? 'var(--danger)' : 'var(--primary)';

        item.innerHTML = `
          <div>
            <div class="key-header">
              <span class="key-code">${key}</span>
              <span class="key-status ${isExpired ? 'status-expired' : 'status-active'}">
                ${isExpired ? 'Hết hạn' : 'Đang dùng'}
              </span>
            </div>
            <div class="key-info" style="margin-top: 4px;">Hạn dùng: ${expireDate.toLocaleDateString('vi-VN')}</div>
          </div>
          <div class="key-actions">
            <button class="btn-sm btn-copy" onclick="copyKey('${key}')">Copy Key</button>
            <button class="btn-sm btn-delete" onclick="deleteKey('${key}')">Xóa</button>
          </div>
        `;
        container.appendChild(item);
      });
    });
  </script>
</body>
</html>
